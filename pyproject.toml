[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "new-agent-memory"
version = "0.1.0"
description = "Explainable human-like memory layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "ZhaoDongdong0109" }
]
keywords = [
  "ai",
  "agents",
  "agent-memory",
  "long-term-memory",
  "memory-management",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ZhaoDongdong0109/new-agent-memory"
Repository = "https://github.com/ZhaoDongdong0109/new-agent-memory"
Issues = "https://github.com/ZhaoDongdong0109/new-agent-memory/issues"

[project.scripts]
new-agent-memory = "new_agent_memory.cli:main"
agent-hub = "hub.cli:main"
hub-sub-agent = "adapters.hub_sub_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "new_agent_memory", "hub", "adapters"]

# 顶层模块：new_agent_memory 包直接 import 这些模块，
# 缺少它们时非 editable 安装完全无法使用
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"memory_chunk.py" = "memory_chunk.py"
"memory_layer_core.py" = "memory_layer_core.py"
"forgotten_layer.py" = "forgotten_layer.py"
"retrieval.py" = "retrieval.py"
"mcp_server.py" = "mcp_server.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
